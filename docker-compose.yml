version: "3.8"
services:
  db:
    image: postgres:15
    container_name: local-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  liquibase:
    build:
      context: .
      dockerfile: Dockerfile.liquibase
    container_name: local-liquibase
    command: update
    volumes:
      - ./liquibase/changelog:/liquibase/changelog
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/mydatabase
      LIQUIBASE_COMMAND_USERNAME: myuser
      LIQUIBASE_COMMAND_PASSWORD: mypassword
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
    depends_on:
      - db

volumes:
  pgdata:
